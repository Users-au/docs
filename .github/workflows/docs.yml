name: Build and deploy documentation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm run build
      - name: Check public entry points
        run: |
          test -s .vitepress/dist/index.html
          test -s .vitepress/dist/zh/index.html
          test -s .vitepress/dist/integrations/synology-dsm.html
          test -s .vitepress/dist/zh/integrations/synology-dsm.html
          test -s .vitepress/dist/sitemap.xml

  deploy:
    name: Publish to Vercel
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: docs-production
    environment:
      name: production
      url: https://docs.users.au
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Deploy the checked commit
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          : "${VERCEL_ORG_ID:?Set VERCEL_ORG_ID in the production environment}"
          : "${VERCEL_PROJECT_ID:?Set VERCEL_PROJECT_ID in the production environment}"
          : "${VERCEL_TOKEN:?Set VERCEL_TOKEN in the production environment}"

          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$remote_main" != "$GITHUB_SHA" ]]; then
            echo "A newer main revision is available. Deploy that revision instead." >&2
            exit 1
          fi

          request="$(jq -nc \
            --arg project "$VERCEL_PROJECT_ID" \
            --arg sha "$GITHUB_SHA" \
            --argjson repo "$REPOSITORY_ID" \
            --slurpfile config vercel.json \
            '{
              name: "usersau-docs",
              project: $project,
              target: "production",
              gitSource: {type: "github", repoId: $repo, ref: "main", sha: $sha},
              projectSettings: ($config[0] | {
                framework, installCommand, buildCommand, outputDirectory, nodeVersion: "24.x"
              })
            }')"
          deployment="$(curl -fsS --max-time 30 \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$request" \
            "https://api.vercel.com/v13/deployments?teamId=$VERCEL_ORG_ID")"
          deployment_id="$(jq -er '.id' <<< "$deployment")"
          echo "Vercel deployment $deployment_id for $GITHUB_SHA"

          for attempt in {1..60}; do
            deployment="$(curl -fsS --retry 2 --max-time 15 \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$deployment_id?teamId=$VERCEL_ORG_ID")"
            case "$(jq -er '.readyState' <<< "$deployment")" in
              READY)
                jq -er '"Ready at https://" + .url' <<< "$deployment"
                exit 0
                ;;
              ERROR|CANCELED)
                jq -r '.errorMessage // .readyState' <<< "$deployment" >&2
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for Vercel deployment $deployment_id" >&2
          exit 1
      - name: Verify the public site
        run: |
          set -o pipefail
          curl -fsS --retry 6 --retry-all-errors https://docs.users.au/ | grep -F 'Authentication documentation' >/dev/null
          curl -fsS --retry 6 --retry-all-errors https://docs.users.au/zh/ | grep -F '身份验证文档' >/dev/null
          curl -fsS --retry 6 --retry-all-errors https://docs.users.au/integrations/synology-dsm >/dev/null
          curl -fsS --retry 6 --retry-all-errors https://docs.users.au/sitemap.xml >/dev/null
