name: Build and deploy documentation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm run build
      - name: Check public entry points
        run: |
          test -s .vitepress/dist/index.html
          test -s .vitepress/dist/zh/index.html
          test -s .vitepress/dist/integrations/synology-dsm.html
          test -s .vitepress/dist/zh/integrations/synology-dsm.html
          test -s .vitepress/dist/sitemap.xml
      - name: Include Vercel routing configuration
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mv .vitepress/dist site
          cp vercel.json site/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: docs-site
          path: site/
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Publish to Vercel
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: docs-production
    environment:
      name: production
      url: https://docs.users.au
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: docs-site
          path: site
      - name: Deploy the checked site
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          : "${VERCEL_ORG_ID:?Set VERCEL_ORG_ID in the production environment}"
          : "${VERCEL_PROJECT_ID:?Set VERCEL_PROJECT_ID in the production environment}"
          : "${VERCEL_TOKEN:?Set VERCEL_TOKEN in the production environment}"

          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$remote_main" != "$GITHUB_SHA" ]]; then
            echo "A newer main revision is available. Deploy that revision instead." >&2
            exit 1
          fi

          request_dir="$(mktemp -d)"
          trap 'rm -f "$request_dir"/{body,headers,request}.json; rmdir "$request_dir"' EXIT
          python3 .github/scripts/vercel-payload.py site "$VERCEL_PROJECT_ID" "$GITHUB_SHA" > "$request_dir/request.json"

          if ! printf 'Authorization: Bearer %s\n' "$VERCEL_TOKEN" | curl -sS --fail-with-body --max-time 45 \
            --header @- --header 'Content-Type: application/json' \
            --dump-header "$request_dir/headers.json" \
            --output "$request_dir/body.json" \
            --data-binary "@$request_dir/request.json" \
            "https://api.vercel.com/v13/deployments?teamId=$VERCEL_ORG_ID"; then
            if [[ -s "$request_dir/body.json" ]]; then
              jq -r '.error | "Vercel API: \(.code // "unknown") — \(.message // "no details")"' \
                "$request_dir/body.json" >&2 || true
            fi
            if [[ -s "$request_dir/headers.json" ]]; then
              grep -Ei '^(retry-after|x-ratelimit-(remaining|reset)):' "$request_dir/headers.json" >&2 || true
            fi
            exit 1
          fi
          deployment="$(cat "$request_dir/body.json")"
          deployment_id="$(jq -er '.id' <<< "$deployment")"
          echo "Vercel deployment $deployment_id for $GITHUB_SHA"

          for attempt in {1..60}; do
            deployment="$(printf 'Authorization: Bearer %s\n' "$VERCEL_TOKEN" | curl -fsS --retry 2 --max-time 15 \
              --header @- \
              "https://api.vercel.com/v13/deployments/$deployment_id?teamId=$VERCEL_ORG_ID")"
            case "$(jq -er '.readyState' <<< "$deployment")" in
              READY)
                jq -er '"Ready at https://" + .url' <<< "$deployment"
                exit 0
                ;;
              ERROR|CANCELED)
                jq -r '.errorMessage // .readyState' <<< "$deployment" >&2
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for Vercel deployment $deployment_id" >&2
          exit 1
      - name: Verify the public site
        run: |
          set -o pipefail
          curl -fsS --retry 6 --retry-all-errors https://docs.users.au/ | grep -F 'Authentication documentation' >/dev/null
          curl -fsS --retry 6 --retry-all-errors https://docs.users.au/zh/ | grep -F '身份验证文档' >/dev/null
          curl -fsS --retry 6 --retry-all-errors https://docs.users.au/integrations/synology-dsm >/dev/null
          curl -fsS --retry 6 --retry-all-errors https://docs.users.au/sitemap.xml >/dev/null
